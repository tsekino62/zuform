name: 機能要望
description: 新しいAWSサービス対応以外の機能改善を提案する
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        機能要望ありがとうございます。新しいAWSサービスの対応リクエストの場合は「AWSサービス対応リクエスト」テンプレートをご利用ください。
  - type: textarea
    id: problem
    attributes:
      label: 課題
      description: 現状どのような点に困っているか、解決したい課題を書いてください。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 提案
      description: どのような機能・変更があれば課題が解決するか、具体的に書いてください。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 代替案
      description: 検討した他の方法や、既存機能での回避策があれば書いてください。
    validations:
      required: false
